name: Bug Report
description: Create a report to help us fix an issue or calculation anomaly in ContentGrid
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in ContentGrid by SPManchester Private Limited!
  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start server with `npm start`
        2. Make API call to `/api/v1/posts`
        3. See unexpected score...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: Node version, OS, browser, etc.
      placeholder: Node.js v22.13.1 on Ubuntu 24.04
    validations:
      required: true
